name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    # `--exclude-no-default-features` is deliberately absent: `default = []`, so the
    # empty-feature build is this crate's primary configuration and must be linted.
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --all-targets

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # The only proof that this crate is no_std, and the only place a tier's bare-metal claim
  # meets something that can refuse it. These targets have no `std` to link against at all,
  # so a `std` dependency anywhere in a cell's graph fails the build here.
  #
  # This job and the tier tests in `tests/public_api.rs` answer different questions, and
  # neither answers the other's. Those tests ask "is the tier's surface reachable through
  # `cronp::`, and does it behave" — they are host integration tests, and the `cronexpr`
  # dev-dependency enables `jiff/default` in their graph, which is std and alloc: the exact
  # two things the bare-metal tiers promise to avoid. A green `tz-static` test there is
  # compatible with the tier having grown a `std` dependency. These cells ask "does this
  # tier need a host", and only that: `--lib`, so no test target, no dev-dependency and no
  # example is in the graph. Merging the two loses the second question, which is the one
  # nothing else in this file asks.
  #
  # One cell per tier that claims to build without a host — a tier with no cell is a claim
  # with no gate, which is how `tz-static` shipped documented as bare-metal and never built
  # for one. `tests/no_std.rs` fails when a feature is added to `Cargo.toml` without either
  # a cell here or an explicit statement that its tier needs a host. `std` and `tz` are the
  # two that carry that statement instead of a cell: `tz` needs an allocator and a tzdb, and
  # `std` builds bare-metal today only because it reaches no code of this crate's, so a cell
  # for it would pin that accident rather than the tier.
  no-std:
    name: no-std (${{ matrix.tier }} / ${{ matrix.target }})
    strategy:
      # Each cell is a different tier's claim, so a red one must not cancel the rest: which
      # tiers still hold is this job's whole output.
      fail-fast: false
      matrix:
        include:
          # The default build. `jiff` is optional, so this graph has no dependency at all,
          # and thumbv6m additionally has no atomic CAS.
          - tier: core-only
            target: thumbv6m-none-eabi
            features: ''
          - tier: core-only
            target: thumbv7em-none-eabi
            features: ''
          # `alloc` pulls nothing on its own — `jiff?/alloc` is a weak feature — so what
          # this cell holds is that the tier never reaches for `std` on the way.
          - tier: alloc
            target: thumbv7em-none-eabi
            features: '--features alloc'
          # The `jiff` row's claim: the dependency compiles in, delivers no capability of
          # its own, and leaves the build no_std.
          - tier: jiff
            target: thumbv7em-none-eabi
            features: '--features jiff'
          # The propagation claim `Cargo.toml` makes: `alloc` reaches jiff through
          # `jiff?/alloc`, and jiff in its alloc mode still needs no `std`.
          - tier: alloc+jiff
            target: thumbv7em-none-eabi
            features: '--features alloc,jiff'
          # The tier documented as bare-metal and no-alloc, on a target that has atomic CAS
          # and so needs nothing from the binary.
          - tier: tz-static
            target: thumbv7em-none-eabi
            features: '--features tz-static'
          # ...and on one that does not. Every tier from `jiff` up reaches
          # `portable-atomic`, which requires the *binary* to pick either its
          # `critical-section` feature or `unsafe-assume-single-core`; a library must not
          # pick for it. The cfg below is the second of those choices in the form a build
          # can pass, and it is in the cell rather than in prose so the cell fails if the
          # README's "with the choice made, `tz-static` builds there too" stops being true.
          # Remove it and this cell goes red on `portable-atomic`'s own `compile_error!`,
          # which is what makes the cell a statement about the choice and not just a build.
          - tier: tz-static +portable-atomic
            target: thumbv6m-none-eabi
            features: '--features tz-static'
            rustflags: --cfg portable_atomic_unsafe_assume_single_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: cargo check --lib --no-default-features ${{ matrix.features }} --target ${{ matrix.target }}
        # `-Dwarnings` is restated rather than added to: a step-level `env` replaces the
        # workflow-level one outright, so leaving it out would make this the one job that
        # lints nothing. Cells that set no `rustflags` render the empty string here.
        env:
          RUSTFLAGS: -Dwarnings ${{ matrix.rustflags }}
        run: cargo check --lib --no-default-features ${{ matrix.features }} --target ${{ matrix.target }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      # `check`, not `test`: dev-dependencies are free to require a newer compiler than
      # the library's declared floor, so this gate covers the library only and says so.
      - name: cargo check (library, no default features)
        run: cargo +${{ steps.msrv.outputs.version }} check --lib --no-default-features
      - name: cargo check (library, all features)
        run: cargo +${{ steps.msrv.outputs.version }} check --lib --all-features

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh "${{ matrix.target }}"

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_sb.sh "${{ matrix.target }}"

  # The template's `loom` job is deliberately absent: this crate has no concurrency and
  # declares no `loom` feature, so the job could only ever fail on an unknown feature.

  # valgrind:
  #   name: valgrind
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Cache cargo build and registry
  #       uses: actions/cache@v6
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ubuntu-latest-valgrind-
  #     - name: Install Rust
  #       run: rustup update stable && rustup default stable
  #     - name: Install Valgrind
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y valgrind
  #     # Uncomment and customize when you have binaries to test:
  #     # - name: cargo build foo
  #     #   run: cargo build --bin foo
  #     #   working-directory: integration
  #     # - name: Run valgrind foo
  #     #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
  #     #   working-directory: integration

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - no-std
      - msrv
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly + llvm-tools-preview
        # `cargo-llvm-cov` needs the `llvm-tools-preview` component for `llvm-profdata`
        # and `llvm-cov`. Nightly is required because doc-test coverage (`--doctests`
        # below) depends on nightly-only rustdoc instrumentation.
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Generate coverage
        # Replaces `cargo tarpaulin`, which failed on this crate inside its own profile
        # reader: `llvm_profparser ... parser failure: Nom(Satisfy)`. `cargo-llvm-cov`
        # drives LLVM's source-based instrumentation directly, so there is no
        # intermediate parser to fail.
        #
        # No `--tests` alongside `--doctests`: cargo-llvm-cov rejects that combination
        # outright. `--doctests` alone already runs the default set — lib unit tests plus
        # `tests/*` — in addition to doc tests, which is the full equivalent of the
        # previous `--run-types lib --run-types tests --run-types doctests`.
        run: |
          cargo llvm-cov --all-features --doctests --workspace \
            --cobertura --output-path cobertura.xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
