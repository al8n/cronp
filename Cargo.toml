[package]
name = "cronp"
version = "0.0.0"
edition = "2021"
repository = "https://github.com/al8n/cronp"
homepage = "https://github.com/al8n/cronp"
documentation = "https://docs.rs/cronp"
description = "A no-std, no-alloc cron expression parser with the dialect on the type"
license = "MIT OR Apache-2.0"
keywords = ["cron", "no_std", "parser", "schedule", "crontab"]
categories = ["parser-implementations", "date-and-time", "no-std", "no-std::no-alloc"]
# 1.85 is the floor this crate declares. logos 0.16 needs 1.80; the extra headroom
# is for `const` in trait-associated positions used by `Dialect`.
rust-version = "1.85"

[[bench]]
path = "benches/parse.rs"
name = "parse"
harness = false

[features]
default = []
alloc = []
std = ["alloc"]
jiff = ["dep:jiff"]
# The design document's feature table also lists `serde`. It is deliberately absent
# until something implements it: a flag that pulls a dependency and produces no impls
# is a claim the crate does not keep. It needs a validating `Deserialize` for
# `CivilDateTime` and a hand-written one for `Years<N>`, since serde has no array
# impls past thirty-two elements — its own task, not a line in this table.

[dependencies]
# `export_derive` re-exports `#[derive(Logos)]`; `forbid_unsafe` makes the generated
# code compatible with this crate's `#![forbid(unsafe_code)]`. Neither pulls in `std`.
logos = { version = "0.16", default-features = false, features = [
  "export_derive",
  "forbid_unsafe",
] }
jiff = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
# `missing_docs` lives in `src/lib.rs`, not here: a `[lints]` table applies to every
# target in the package, including `build.rs`, which has no crate documentation.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
