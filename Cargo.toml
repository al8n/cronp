[package]
name = "cronp"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/al8n/cronp"
homepage = "https://github.com/al8n/cronp"
documentation = "https://docs.rs/cronp"
description = "A blazing fast no-std, no-alloc cron expression parser with multiple dialects support"
license = "MIT OR Apache-2.0"
keywords = ["cron", "cron-parser", "croner", "schedule", "crontab"]
categories = ["parser-implementations", "date-and-time", "no-std", "no-std::no-alloc"]
rust-version = "1.85"

[[bench]]
path = "benches/parse.rs"
name = "parse"
harness = false

[features]
default = []

# Tier propagation. These say what tier the build is, and every optional dependency
# learns it through `?` — so `--features std,jiff` is jiff in its `std` mode rather than
# jiff quietly staying `no_std` inside a `std` build. A second optional dependency later
# costs one more `dep?/std` on a line that already exists.
alloc = ["jiff?/alloc"]
std = ["alloc", "jiff?/std"]

# Capability selection, layered on the propagation above. `jiff` is the exception: it
# names the dependency the two tiers below stand on and selects no capability of its own,
# so enabling it alone changes nothing a caller can see. Nothing in this crate reaches
# jiff except the timezone tiers.
jiff = ["dep:jiff"]
# Resolve against timezones the application names at compile time. `jiff/static` pulls
# neither `alloc` nor `std`, which is what keeps this tier bare-metal.
tz-static = ["jiff", "jiff/static"]
# Resolve any IANA name at runtime. The three tzdb features are what the tier promises on
# the three kinds of host jiff distinguishes: `tzdb-bundle-platform` embeds the database
# where the platform has none (Windows, wasm), `tzdb-zoneinfo` reads `/usr/share/zoneinfo`
# on Unix, and `tzdb-concatenated` reads Android's concatenated tzdata. Dropping any one
# of them silently narrows "any IANA name" to "any IANA name on some hosts" —
# `tzdb-bundle-platform` alone resolves nothing at all on Linux or macOS.
tz = [
  "jiff",
  "std",
  "jiff/tzdb-bundle-platform",
  "jiff/tzdb-zoneinfo",
  "jiff/tzdb-concatenated",
]

[dependencies]
jiff = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
chrono = "0.4"
criterion = "0.8"
logos = { version = "0.16", default-features = false, features = [
  "export_derive",
  "forbid_unsafe",
] }

# The four comparison parsers, pinned to an exact version rather than a range.
#
# These are oracles, not utilities. `tests/matcher_differential.rs` holds this crate's
# matcher against them and excludes the cases they cannot answer for, and every one of
# those exclusions is a statement about a specific released version — cronexpr 1.6.0's
# December `L`/`nL` defect, croner 3.0.1's `field == "*"` wildcard test, saffron 0.1.0's
# parsed-shape one, cron 0.17.0's absent union rule. `benches/parse.rs` and the README's
# comparison table name the same four versions. A caret range lets a clean checkout
# resolve something else and keep the old exclusions, so a green run would no longer mean
# the claimed oracle was exercised. This repository has already been burned by that once:
# `cronexpr = "1"` resolved to 1.4.0 in one worktree and 1.6.0 in another, and an A/B
# showed an untouched dependency getting twice as fast between two commits.
#
# `Cargo.lock` is `.gitignore`d, so every checkout resolves from scratch and the
# requirement is the only place a pin can live. cronexpr 1.5 and 1.6 declare
# `rust-version = 1.88`, above this crate's 1.85, so a caret range makes the MSRV-aware
# resolver pick 1.4.0 — the exact requirement is what makes a fresh `cargo test` see the
# oracle the exclusions describe. The MSRV job is unaffected: it runs `cargo check --lib`,
# which resolves the dev-dependencies without building them.
#
# Raising one of these is a deliberate act: re-run the differential, and expect the
# self-invalidating guards in that file to tell you which exclusions the new version has
# retired.
cron = "=0.17.0"
croner = "=3.0.1"
cronexpr = "=1.6.0"
saffron = "=0.1.0"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }
