[package]
name = "cronp"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/al8n/cronp"
homepage = "https://github.com/al8n/cronp"
documentation = "https://docs.rs/cronp"
description = "A blazing fast no-std, no-alloc cron expression parser with multiple dialects support"
license = "MIT OR Apache-2.0"
keywords = ["cron", "cron-parser", "croner", "schedule", "crontab"]
categories = ["parser-implementations", "date-and-time", "no-std", "no-std::no-alloc"]
rust-version = "1.85"

[[bench]]
path = "benches/parse.rs"
name = "parse"
harness = false

[features]
default = []
alloc = ["jiff?/alloc"]
std = ["alloc", "jiff?/std"]

jiff = ["dep:jiff"]
tz-static = ["jiff", "jiff/static"]
tz = [
  "jiff",
  "std",
  "jiff/tzdb-bundle-platform",
  "jiff/tzdb-zoneinfo",
  "jiff/tzdb-concatenated",
]

[dependencies]
jiff = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
chrono = "0.4"
criterion = "0.8"
logos = { version = "0.16", default-features = false, features = [
  "export_derive",
  "forbid_unsafe",
] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
yaml-rust2 = { version = "0.11", default-features = false }
cron = "=0.17.0"
croner = "=3.0.1"
cronexpr = "=1.6.0"
saffron = "=0.1.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }
